name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build:gh
        env:
          # Project pages are served from /<repo-name>/; a user site uses /
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback for unknown routes
        run: cp dist-gh/index.html dist-gh/404.html && touch dist-gh/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-gh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
